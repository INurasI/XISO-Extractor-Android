name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: app-src
      - uses: actions/checkout@v4
        with:
          repository: antangelo/xdvdfs
          ref: main
          path: xdvdfs-src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Build xdvdfs ARM64 engine
        working-directory: xdvdfs-src
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android23-clang"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER" >> "$GITHUB_ENV"
          cargo build --release --target aarch64-linux-android -p xdvdfs-cli
      - name: Embed engine
        run: |
          mkdir -p app-src/app/src/main/assets
          cp xdvdfs-src/target/aarch64-linux-android/release/xdvdfs app-src/app/src/main/assets/xdvdfs
      - name: Build APK
        working-directory: app-src
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: XISO-Extractor-Android-debug
          path: app-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
